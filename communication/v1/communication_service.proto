service NotificationService { 
    rpc GetNotification(GetNotificationReq)returns(GetNotificationRes); 
    rpc MarkNotificationAsRead(MarkNotificationAsReadRequest) returns (MarkNotificationAsReadResponse);
    rpc MarkAllNotificationsAsRead(MarkAllNotificationsAsReadRequest) returns (MarkAllNotificationsAsReadResponse);
    rpc AcceptPlayerRequest(AcceptPlayerRequestRequest) returns (AcceptPlayerRequestResponse);
    rpc RejectPlayerRequest(RejectPlayerRequestRequest) returns (RejectPlayerRequestResponse);
}