syntax ='proto3'; 

package team; 

option go_package = "github.com/Junaidmdv/goalcircle-protos/team/v1;teamv1";  

import "google/protobuf/timestamp.proto";


message TeamOwnerDetails{
    string user_id=1;    
    string full_name=2; 
}




message CreateTeamReq{
    string name=1; 
    string city=2; 
    string description = 3; 
    string refresh_token=4;   
    string contact_num=5;  
    string email=6;
    string user_id=7; 
    string owner_name=8; 
}



message UserRes{
   string session_id=1; 
   string user_id=2;  
   string email=3;  
   string access_token=4;  
   google.protobuf.Timestamp access_token_expiry=5; 
   string refresh_token=6; 
   google.protobuf.Timestamp refresh_token_expiry=7;
} 

message TeamDetailsRes{
  string id=1;  
  string name=2; 
  string short_name=3;  
  string city=4; 
  string team_code=5;
} 

message TeamMemberDetails{
  string staff_id=1; 
  string team_member_id=2; 
  string full_name=3;  
  string designation=5;  
  string role=6;
}


message CreateTeamRes{   
  UserRes user=1;  
  TeamDetailsRes team_details=2; 
  TeamMemberDetails team_owner=3;
} 


message UpdateTeamReq{   
  string user_id=1; 
  string team_id=2;
  optional string name=3; 
  optional string city=4; 
  optional string description = 5; 
  optional string short_name=6; 
  optional string email=7;  
  optional string phone_number=8;
}


message UpdateTeamRes{  
  string team_id=1; 
  string name=2; 
  string city=3; 
  string description = 4; 
  string short_name=5;
}







message SetCaptainRes{ 
  string player_id=2;
} 

message SetCaptainReq{
   string user_id=1; 
   string team_id=2; 
   string player_id=3; 
}

message SetViceCaptainRes{
   string player_id=1;
}

message SetViceCaptainReq{
   string user_id=1; 
   string team_id=2; 
   string player_id=3;
}  


enum TeamStatus {
  TEAM_STATUS_UNSPECIFIED = 0;
  TEAM_STATUS_ACTIVE = 1;
  TEAM_STATUS_INACTIVE = 2;
  TEAM_STATUS_SUSPENDED = 3;
  TEAM_STATUS_ARCHIVED = 4;
}


message ListTeamReq{
   int32  page=1; 
   int32 limit=2; 
   string city=3;
   TeamStatus team_status=4;
   string search=5;
}


message TeamDetails{
   string team_id=1; 
   string name=2;  
   string city=3;  
   string team_code=4;  
   TeamStatus team_status=5;
} 


message  PaginateTeam {
   int32 total_page=1; 
   int32 page=2; 
   int32 limit=3;  
   int64 total_item=4;
}



message ListTeamRes{
  repeated TeamDetails team_details = 1; 
  PaginateTeam pagination=2;
}


message GetTeamReq{
   string team_id=1; 
}  



message GetTeamRes{
   string team_id=1; 
   string name=2;  
   string short_name=3;  
   string city=4;  
   string team_code=6;  
   string email=7; 
   string phone_num=8; 
   string team_status=9;  
   int32  player_count=10; 
   string caption_id=11;  
   string vice_caption_id=12; 
   string description = 13; 
   google.protobuf.Timestamp created_at = 14;
}

message TeamLogoMetaData{ 
   string user_id=1;
   string content_type=2;  
   string team_id=3;
}


message AddLogoReq{
   oneof data {
     TeamLogoMetaData  meta_data=1; 
      bytes chunk=2;
   }
}

message AddLogoRes{   
   string team_id=1;
   string resigned_url=2; 
}


message RemoveLgoReq{
   string team_id=1; 
   string user_id=2;
}

message RemoveLogoRes{
   string team_id=1; 
}




message GetPresignedUrlReq{
    string team_id=1;
}

message GetPresignedUrlRes{
   string team_id=1; 
   string presigned_url=2;
}





service TeamService {
   rpc CreateTeam(CreateTeamReq)returns (CreateTeamRes); 
   rpc UpdateTeam(UpdateTeamReq)returns(UpdateTeamRes);  
   rpc SetCaptain(SetCaptainReq)returns(SetCaptainRes); 
   rpc SetViceCaptain(SetViceCaptainReq)returns(SetViceCaptainRes); 
   rpc ListTeam(ListTeamReq)returns(ListTeamRes); 
   rpc GetTeam(GetTeamReq)returns(GetTeamRes); 
   rpc AddLogo(stream AddLogoReq)returns(AddLogoRes); 
   rpc RemoveLogo(RemoveLgoReq)returns(RemoveLogoRes); 
   rpc GetLogoPresignedUrl(GetPresignedUrlReq)returns(GetPresignedUrlRes);
}

enum PlayerStatus {
  PLAYER_STATUS_UNSPECIFIED = 0;

  PLAYER_STATUS_ACTIVE = 1;
  PLAYER_STATUS_INACTIVE = 2;
  PLAYER_STATUS_SUSPENDED = 3;
  PLAYER_STATUS_LEFT = 4;
}

enum PlayerPosition {
  PLAYER_POSITION_UNSPECIFIED = 0;

  PLAYER_POSITION_GOALKEEPER = 1;
  PLAYER_POSITION_DEFENDER = 2;
  PLAYER_POSITION_MIDFIELDER = 3;
  PLAYER_POSITION_FORWARD = 4;
}

enum PreferredFoot {
  PREFERRED_FOOT_UNSPECIFIED = 0;
  PREFERRED_FOOT_LEFT = 1;
  PREFERRED_FOOT_RIGHT = 2;
  PREFERRED_FOOT_BOTH = 3;
}



message PlayerDetails{
  string full_name=1; 
  google.protobuf.Timestamp dob=2; 
  string nationality=3;  
  PlayerPosition position=4; 
  PreferredFoot prefered_foot=5; 
  float height=6;
  float weight=7;
  string user_id=8; 
  string city=9;
  string refresh_token=10;
}



message AddPlayerReq{  
   oneof player{
      PlayerDetails player_details=1; 
      bytes player_image_chunks=2;
   }
} 

message AddPlayerRes{ 
   message PlayerDetails{
    string player_id=1; 
    string full_name=2; 
    string dob=3; 
    string nationality=4;  
    string position=5; 
    string prefered_foot=6;
    string presigned_url=7;  
    float height=8; 
    float weight=9;
   } 
   message UserDetails{
      string session_id=1; 
      string user_id=2;  
      string email=3;  
      string access_token=4;  
      google.protobuf.Timestamp access_token_expiry=5; 
      string refresh_token=6; 
      google.protobuf.Timestamp refresh_token_expiry=7;
   }

   PlayerDetails player_details = 1; 
   UserDetails user_details = 2;
}

message UpdatePlayerRequest {
  string user_id = 1;
  optional string full_name = 2;
  optional google.protobuf.Timestamp date_of_birth = 3;
  optional PlayerPosition position = 4;
  optional string nationality=5;
  optional PreferredFoot preferred_foot = 6; 
  optional PlayerStatus status = 7;  
  optional float height=8;
  optional float weight=9; 
}

message UpdatePlayersResponse {
   string user_id = 1;
   string full_name = 2;
   google.protobuf.Timestamp date_of_birth = 3;
   string position = 4;
   string nationality=5;
   string preferred_foot = 6; 
   string status = 7;  
   float height=8;
   float weight=9; 
}

message PlayerList{
   string player_id=1;
   string team_member_id=2;
   string full_name=3;
   int32 jersey_number=4; 
   string position=5;  
   string image_url=6;
}

message PaginationDetails{
    int32 total_page=1; 
    int32 page=2; 
    int32 limit=3;  
    int64 total_item=4;
}



message GetPlayerReq{
   string player_id=1;  
   string team_id=2;
}


message  GetPlayerRes {
  string player_id = 1;
  string full_name = 2;
  google.protobuf.Timestamp date_of_birth = 3;
  string position = 4;
  string preferred_foot = 5;
  string nationality = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;

}


message UpdatePlayerImageMeta{
    string team_id=1; 
    string player_id=2;
    string user_id=3;

}

message UpdatePlayerImageReq{
     oneof data {
         UpdatePlayerImageMeta meta=1; 
         bytes chunks=2;
     }
}

message UpdatePlayerImageRes{
   string user_id=1;
   string presigned_url=2; 
}


message GetPlayerPresignedUrlReq{
     string player_id=1;
}

message GetPlayerPresignedUrlRes{
     string player_id=1; 
     string presigned_url=2; 
}

message RemovePlayerImageReq{ 
     string  team_id=1; 
     string  user_id=2; 
     string player_id=3;
}

message RemovePlayerImageRes{
    bool success=1;
} 


message ListPlayersReq{
   int32  page=1; 
   int32 limit=2; 
   optional PlayerPosition position=3;   
   optional PlayerStatus player_status=4;
   optional  string search=5;
}

message ListPlayerReq{
   int32 limit=1; 
   int32 page=2; 
   string search=3; 
   
}

message ListPlayerRes{
   message PlayerDetails{
      string player_id=1; 
      string user_id=2; 
      string nationality=3; 
      string preferred_foot=4; 
      string position=5;
   }
}

message PlayerProfileReq{
   string user_id=1;
}

message PlayerProfileRes{
   string user_id = 1;
   string full_name = 2;
   google.protobuf.Timestamp date_of_birth = 3;
   PlayerPosition position = 4;
   string nationality=5;
   PreferredFoot preferred_foot = 6; 
   PlayerStatus status = 7;  
   float height=8;
   float weight=9; 
   string city=10;
}

message GetMyTeamsReq{
 string user_id=1;
}

message GetMyTeamsRes{
   message TeamDetails{

   }
   string user_id=1; 
   TeamDetails team_details = 2;
}




service PlayerService{
  rpc AddNewPlayer(stream AddPlayerReq)returns(AddPlayerRes); 
  rpc UpdatePlayerDetails(UpdatePlayerRequest)returns(UpdatePlayersResponse); 
  rpc ListPlayer(ListPlayerReq)returns(ListPlayerRes);
  rpc GetPlayer(GetPlayerReq)returns(GetPlayerRes);  
  rpc UpdatePlayerImage(stream UpdatePlayerImageReq)returns(UpdatePlayerImageRes); 
  rpc GetPlayerPresignedUrl(GetPlayerPresignedUrlReq)returns(GetPlayerPresignedUrlRes);  
  rpc RemovePlayerImage(RemovePlayerImageReq)returns(RemovePlayerImageRes);
  rpc PlayerProfile(PlayerProfileReq)returns(PlayerProfileRes);
  rpc GetMyTeams(GetMyTeamsReq)returns(GetMyTeamsRes);
}

message GetTeamPlayerReq{
   string team_id=1; 
   string player_id=2;
}

message GetTeamPlayerRes{

}

message ReleasePlayerReq{
    string player_id=1; 
    string team_id=2; 
    string user_id=3; 
}


message ReleasePlayerRes{
  string player_id = 1;
  string team_member_id = 2;
  string full_name = 3;
  int32 jersey_number = 4;
  string position = 5;
  string status = 6;
  google.protobuf.Timestamp released_at = 7;
  google.protobuf.Timestamp joined_at = 8;
}


message ListTeamPlayerRes{ 
   PaginationDetails paginate=1;
   repeated PlayerList players=2;
}
message ListTeamPlayerReq{
   string team_id=1; 
   int32  page=2; 
   int32 limit=3; 
   optional PlayerPosition position=4;   
   optional PlayerStatus player_status=5;
   optional  string search=6;
}

message SendPlayerRequestReq{
   
}

message SendPlayerRequestRes{

}





service  TeamPlayerService {
  rpc GetTeamPlayer(GetTeamPlayerReq)returns(GetTeamPlayerRes);
  rpc ReleasePlayer(ReleasePlayerReq)returns(ReleasePlayerRes);  
  rpc ListTeamPlayer(ListTeamPlayerReq)returns(ListTeamPlayerRes); 
  rpc SendPlayerReq(SendPlayerRequestReq)returns(SendPlayerRequestRes);
}


enum StaffDesignation {
  STAFF_DESIGNATION_UNSPECIFIED = 0;

  STAFF_DESIGNATION_OWNER = 1;
  STAFF_DESIGNATION_MANAGER = 2;

  STAFF_DESIGNATION_HEAD_COACH = 3;
  STAFF_DESIGNATION_ASSISTANT_COACH = 4;
  STAFF_DESIGNATION_GOALKEEPER_COACH = 5;
  STAFF_DESIGNATION_FITNESS_COACH = 6;

  STAFF_DESIGNATION_PHYSIO = 7;
  STAFF_DESIGNATION_DOCTOR = 8;

  STAFF_DESIGNATION_ANALYST = 9;
  STAFF_DESIGNATION_OTHER = 10;
}

enum StaffRole {
  STAFF_ROLE_UNSPECIFIED = 0;
  STAFF_ROLE_MANAGEMENT = 1;
  STAFF_ROLE_COACH = 2;
  STAFF_ROLE_MEDICAL = 3;
  STAFF_ROLE_OTHER = 4;
}


message AddStaffReq{  
  string team_id=1;  
  string user_id=2;
  string full_name=3;   
  optional string phone_num=4;
  StaffRole role=5;
  StaffDesignation designation=6; 
}

message AddStaffRes{
   string code=1; 
   string full_name=2; 
   string role=3; 
   string designation=4;
} 

message StaffImageMeta{
   string team_id=1; 
   string staff_id=2; 
   string  user_id=3;
}

message UpdateStaffImageReq{  
 oneof data {
         StaffImageMeta meta=1; 
         bytes chunks=2;
     }

} 

message UpdateStaffImageRes{
    string staff_id=1; 
    string presigned_url=2; 
}  

message GetStaffImageUrlReq{
  string staff_id=1; 
  string team_id=2;
}

message GetStaffImageUrlRes{
   string staff_id=1; 
   string presigned_url=2;
}


message RemoveStaffImageReq{
    string user_id=1; 
    string team_id=2; 
    string staff_id=3;
} 

message RemoveStaffImageRes{
   bool success=1;
}

message UpdateStaffReq{
  string user_id=1; 
  string team_id=2;  
  string staff_id=3; 
  optional string full_name=4; 
  optional StaffRole role=6; 
  optional StaffDesignation designation=7; 
  optional string phone_num=8;
}

message UpdateStaffRes{
  string staff_id = 1;
  string team_member_id = 2;
  string full_name = 3;
  google.protobuf.Timestamp date_of_birth = 4;
  int32 age = 5;
  string role = 6;
  string designation = 7;
  string phone_num = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
} 

message GetStaffReq{
   string staff_id=1; 
   string team_id=2; 
} 

message GetStaffRes{
  string id = 1;
  string team_member_id = 2;
  string full_name = 3;
  string role = 5;
  string designation = 6;
  string phone_num = 7;
  google.protobuf.Timestamp created_at = 8;
  string status = 9;
  string joined_at = 10;
  optional string released_at = 11;
  optional string resigned_at = 12;
}
 
message ListTeamStaffReq{
 string team_id=1; 
 int32   page=2; 
 int32   limit=3; 
 StaffRole   role=4; 
 StaffDesignation   designation=5; 
 string   search=6;
}

message StaffDetailResponse{ 
   string staff_id=1; 
   string team_member_id=2;
   string full_name=3;  
   string role=4; 
   string designation=5; 
   string presigned_url=6; 
   string status=7;
} 

message StaffPaginationDetails{
  int32 total_page=1;  
  int32 page=2;  
  int32 limit=3; 
  int64 total=4;
}


message ListTeamStaffRes{
  repeated StaffDetailResponse staff_detail = 1; 
  StaffPaginationDetails pagination=2;
} 

message ReleaseStaffReq{
  string user_id=1; 
  string staff_id=2; 
  string  team_id=3;
} 

message ReleaseStaffRes{
  string staff_id = 1;
  string team_member_id = 2;
  string full_name = 3;
  string role = 4;
  string designation = 5;
  string status = 6;
  string joined_at = 7;
  string released_at = 8;
}

message TransferOwnershipReq{

} 

message TransferOwnershipRes{

} 

message GetStaffProfileReq{ 
   string user_id=1;
} 




message GetStaffProfileRes{ 
    message TeamDetails{
     string team_id=1;  
     string name=2;  
     string short_name=3; 
     string city=4;  
     string team_code=5; 
   }
   message StaffDetails{
      string staff_id=1; 
      string team_member_id=2;  
      string user_id=3;  
      string full_name=4;  
      string role=5;  
      string designation=6; 
      string phone_num=7;  
      google.protobuf.Timestamp created_at = 8; 
   }
  

   TeamDetails team=1; 
    StaffDetails staff=2;
} 


message JoinStaffReq{
   string user_id=1; 
   string code=2;  
   string refresh_token=3;
} 

message JoinStaffRes{
   message StaffDetails{
      string staff_id=1; 
      string team_member_id=2;  
      string user_id=3;  
      string full_name=4;  
      string role=5;  
      string designation=6; 
      string phone_num=7;  
      google.protobuf.Timestamp created_at = 8; 
   } 

   message UserResponse{
   string session_id=1; 
   string user_id=2;  
   string email=3;  
   string access_token=4;  
   google.protobuf.Timestamp access_token_expiry=5; 
   string refresh_token=6; 
   google.protobuf.Timestamp refresh_token_expiry=7;
   }
   
   JoinStaffRes.StaffDetails staff=1; 
   UserResponse user=2;
}


service StaffService {
     rpc AddStaff(AddStaffReq)returns(AddStaffRes);  
     rpc JoinStaff(JoinStaffReq)returns(JoinStaffRes);
     rpc GetStaff(GetStaffReq)returns(GetStaffRes);
     rpc UpdateStaffImage(stream UpdateStaffImageReq)returns(UpdateStaffImageRes); 
     rpc GetStaffImageUrl(GetStaffImageUrlReq)returns(GetStaffImageUrlRes); 
     rpc RemoveStaffImage(RemoveStaffImageReq)returns(RemoveStaffImageRes);  
     rpc UpdateStaff(UpdateStaffReq)returns(UpdateStaffRes);  
     rpc ListTeamStaff(ListTeamStaffReq)returns(ListTeamStaffRes); 
     rpc ReleaseStaff(ReleaseStaffReq)returns(ReleaseStaffRes); 
     rpc TransferOwnership(TransferOwnershipReq)returns(TransferOwnershipRes); 
     rpc GetStaffProfile(GetStaffProfileReq)returns(GetStaffProfileRes);  
     
}